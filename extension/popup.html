<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Tracker Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 10px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    h1 { font-size: 14px; font-weight: 700; color: #fff; }
    .subtitle { font-size: 11px; color: #a1a1aa; }

    label { display: block; font-size: 11px; font-weight: 600; color: #a1a1aa; text-transform: uppercase; margin-bottom: 5px; }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #10b981; }

    .radio-group {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 14px;
      font-size: 11px;
    }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      color: #d4d4d8;
    }
    .radio-item:last-child { margin-bottom: 0; }

    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      background: #10b981;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }

    .status-badge {
      margin-top: 10px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #10b981;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }

    .history-box {
      margin-top: 14px;
      border-top: 1px solid #27272a;
      padding-top: 10px;
    }
    .history-title { font-size: 10px; font-weight: bold; text-transform: uppercase; color: #71717a; margin-bottom: 6px; }
    .history-item {
      font-size: 11px;
      padding: 5px 8px;
      background: #27272a;
      border-radius: 6px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      color: #d4d4d8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">⚡</div>
    <div>
      <h1>DSA Tracker Auto-Sync</h1>
      <div class="subtitle">LeetCode & GFG Auto Capture</div>
    </div>
  </div>

  <form id="settingsForm">
    <label for="syncKeyInput">Your Sync Key</label>
    <input type="text" id="syncKeyInput" placeholder="e.g. manav_prep" required />

    <label>Target Backend API</label>
    <div class="radio-group">
      <label class="radio-item">
        <input type="radio" name="backendType" value="https://dsa-plan-backend.onrender.com" checked />
        <span>Live Cloud (Render)</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="backendType" value="http://localhost:5000" />
        <span>Localhost (port 5000)</span>
      </label>
    </div>

    <button type="submit" class="btn" id="saveBtn">Save Settings</button>
  </form>

  <div class="status-badge" id="statusMessage">
    <span class="dot"></span>
    <span id="statusText">Ready to auto-capture LeetCode</span>
  </div>

  <div class="history-box" id="historyBox" style="display: none;">
    <div class="history-title">Recently Synced Submissions</div>
    <div id="historyList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
